<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Q&A 🎁</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#383838,#111 60%,#050505);display:flex;align-items:center;justify-content:center}.card{width:min(92%,560px);text-align:center;padding:28px 20px}.emoji{font-size:64px;animation:float 2s ease-in-out infinite}.count{margin:12px 0;color:#aaa;font-size:13px;letter-spacing:2px}.question{font-size:clamp(27px,7vw,42px);margin:14px 0}.sub{color:#ccc;line-height:1.5;margin-bottom:25px}.options{display:grid;gap:12px}.option,input{border:1px solid #444;background:#ffffff12;color:#fff;border-radius:16px;padding:17px 14px;font-size:17px;font-weight:bold}.option{cursor:pointer;transition:.2s}.option:hover{background:#ffffff22;transform:translateY(-2px)}input{width:100%;outline:none;text-align:center;margin-bottom:12px}input::placeholder{color:#aaa}.hidden{display:none!important}.cinematic{position:fixed;inset:0;width:100vw;height:100vh;background:#000;z-index:25;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;animation:cinematicIn 2s ease forwards}.cinematic h1{font-size:clamp(36px,8vw,72px);font-weight:500;letter-spacing:1px;opacity:0;animation:textIn 1.5s ease 1s forwards}.cinematic.fadeout{animation:cinematicOut 1.8s ease forwards}.cinematic.fadeout h1{animation:textOut 1s ease forwards}.analysis{position:fixed;inset:0;background:#070707;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}.analysis-inner{width:min(90%,650px)}.analysis h1{font-size:clamp(30px,7vw,52px);margin-bottom:12px}.loader{height:14px;width:100%;border:1px solid #444;border-radius:20px;overflow:hidden;margin:28px 0}.bar{height:100%;width:0;background:#fff;animation:load 5s ease-in-out forwards}.status{color:#aaa;min-height:28px}.final{position:fixed;inset:0;background:#050505;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;z-index:40}.final h1{font-size:clamp(38px,12vw,76px);margin:0}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes cinematicIn{from{opacity:0}to{opacity:1}}@keyframes textIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes cinematicOut{from{opacity:1}to{opacity:0}}@keyframes textOut{from{opacity:1}to{opacity:0}}@keyframes load{to{width:100%}}
</style></head>
<body>
<div class="card" id="nameCard"><div class="emoji">👋</div><div class="count">WELCOME</div><h1 class="question">Before we start...</h1><p class="sub">What’s your name? 👀</p><input id="nameInput" maxlength="30" placeholder="Enter your name..." autocomplete="off"><button class="option" onclick="startQA()">🚀 LET'S START</button></div>
<div class="card hidden" id="card"><div class="emoji" id="emoji">🧠</div><div class="count" id="count">QUESTION 1 / 5</div><h1 class="question" id="question"></h1><p class="sub" id="sub"></p><div class="options" id="options"></div></div>
<div class="cinematic hidden" id="cinematic"><h1>Can you still stay? ☠️</h1></div>
<div class="analysis hidden" id="analysis"><div class="analysis-inner"><div class="emoji">🧠</div><h1>Analyzing your results...</h1><p class="status" id="status">Processing your answers...</p><div class="loader"><div class="bar"></div></div><p class="status">Please don't close the page or minimize the browser.</p></div></div>
<div class="final hidden" id="final"><div><div class="emoji">😂</div><h1 id="finalTitle">YOU GOT PRANKED! 💀</h1></div></div>
<audio id="comedy" preload="auto" src="Comedy.mp3"></audio>
<script>
const questions=[
 ['🧠','Which matters most when making an important decision?','Choose honestly.',['Logic','Feelings','A balance of both']],
 ['💡','If you could instantly master one skill, which would you choose?','No wrong answer.',['Communication','Problem solving','Creativity']],
 ['🎯','If two choices seem equally good, what would you usually do?','Think carefully...',['Pick one quickly','Compare the pros and cons','Ask someone I trust']],
 ['🔍','When you notice a mistake you made, what do you usually do first?','Be honest.',['Fix it immediately','Figure out why it happened','Leave it and come back later']],
 ['🤔','Would you rather know the complete truth or stay comfortable?','Final question.',['Always know the truth','Stay comfortable','Depends on the situation']]
];
let current=0,name='';const q=document.getElementById('question'),sub=document.getElementById('sub'),opts=document.getElementById('options'),emoji=document.getElementById('emoji'),count=document.getElementById('count'),audio=document.getElementById('comedy');
function startQA(){name=document.getElementById('nameInput').value.trim()||'Mystery Person';document.getElementById('nameCard').classList.add('hidden');document.getElementById('card').classList.remove('hidden');render()}
function render(){let x=questions[current];emoji.textContent=x[0];count.textContent=`QUESTION ${current+1} / 5`;q.textContent=current===0?`Ready, ${name}? ${x[1]}`:x[1];sub.textContent=x[2];opts.innerHTML='';x[3].forEach(t=>{let b=document.createElement('button');b.className='option';b.textContent=t;b.onclick=answer;opts.appendChild(b)})}
function answer(){if(current===2){audio.currentTime=0;audio.play().catch(()=>{});document.getElementById('card').classList.add('hidden');showCinematic();return}if(current===4){document.getElementById('card').classList.add('hidden');startAnalysis();return}current++;render()}
function showCinematic(){const c=document.getElementById('cinematic');c.classList.remove('hidden');setTimeout(()=>{c.classList.add('fadeout');setTimeout(()=>{c.classList.add('hidden');current++;render();document.getElementById('card').classList.remove('hidden')},1800)},3200)}
function startAnalysis(){document.getElementById('analysis').classList.remove('hidden');let messages=['Processing your answers...','Comparing decision patterns...','Checking logical consistency...','Calculating personality score...','Almost finished...'];let i=0;document.getElementById('status').textContent=messages[0];let timer=setInterval(()=>{i++;if(i<messages.length)document.getElementById('status').textContent=messages[i];else{clearInterval(timer);setTimeout(()=>{document.getElementById('analysis').classList.add('hidden');document.getElementById('final').classList.remove('hidden');document.getElementById('finalTitle').textContent=`${name}, YOU GOT PRANKED! 💀`},500)}},1000)}
</script></body></html>
