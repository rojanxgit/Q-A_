<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q&A 🎁</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#383838,#111 60%,#050505);display:flex;align-items:center;justify-content:center;overflow:hidden}.card{width:min(92%,520px);text-align:center;padding:28px 20px}.emoji{font-size:68px;animation:float 2s ease-in-out infinite}.count{margin-top:12px;color:#aaa;font-size:13px;letter-spacing:2px}.question{font-size:clamp(27px,7vw,42px);margin:14px 0}.sub{color:#ccc;line-height:1.5;margin-bottom:25px}.options{display:grid;gap:12px}.option,input{border:1px solid #444;background:#ffffff12;color:#fff;border-radius:16px;padding:17px 14px;font-size:17px;font-weight:bold}.option{cursor:pointer;transition:.2s}.option:hover{background:#ffffff22;transform:translateY(-2px)}input{width:100%;outline:none;text-align:center;margin-bottom:12px}input::placeholder{color:#aaa}.hidden{display:none!important}.fullscreen{position:fixed;inset:0;width:100vw;height:100vh;background:radial-gradient(circle at center,#292929,#050505);z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}.fullscreen .inner{width:min(90%,700px)}.fullscreen .question{font-size:clamp(38px,9vw,76px);margin:20px 0}.fullscreen .sub{font-size:18px}.final{position:fixed;inset:0;background:#050505;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}.final h1{font-size:clamp(38px,12vw,76px);margin:0}.final p{font-size:20px;color:#ccc}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
</head>
<body>
<div class="card" id="nameCard"><div class="emoji">👋</div><div class="count">WELCOME</div><h1 class="question">Before we start...</h1><p class="sub">What’s your name? 👀</p><input id="nameInput" type="text" maxlength="30" placeholder="Enter your name..." autocomplete="off"><button class="option" onclick="startQA()">🚀 LET'S START</button></div>
<div class="card hidden" id="card"><div class="emoji" id="emoji">🤔</div><div class="count" id="count">QUESTION 1 / 10</div><h1 class="question" id="question"></h1><p class="sub" id="sub"></p><div class="options" id="options"></div></div>
<div class="fullscreen hidden" id="stayCard"><div class="inner"><div class="emoji">👀</div><h1 class="question">Can you still stay? 👀</h1><p class="sub">That was unexpected... 😂</p><div class="options"><button class="option" onclick="continueQA()">😎 Yeah, I can stay</button><button class="option" onclick="continueQA()">😂 What was that?</button><button class="option" onclick="continueQA()">💀 I'm leaving</button></div></div></div>
<div class="final hidden" id="final"><div><div class="emoji">😂</div><h1 id="finalTitle">YOU GOT PRANKED! 💀</h1><p id="finalText">Thanks for making it all the way to Question 10 😭</p></div></div>
<audio id="comedy" preload="auto" src="Comedy.mp3"></audio>
<script>
const questions=[
 ['🤔','Let’s see how well you know me... 👀','Pick one answer 😌',['😎 Obviously I know you','🤨 Maybe...','💀 I have no idea']],
 ['🧐','What’s your favorite thing about me?','Be honest 😂',['😂 Your humor','😎 Your vibe','🤫 Can’t tell you']],
 ['😏','Do you trust me?','This answer might matter later...',['❤️ Yes','🤔 Mostly','💀 Not anymore']],
 ['🙃','Would you answer one random question?','Just say yes... 😭',['✅ Sure','😬 I guess','🚪 I want to leave']],
 ['👀','Are you enjoying this?','We’re almost halfway there...',['😎 Definitely','😂 A little','🤨 What’s happening?']],
 ['🤨','Do you think there’s actually a surprise?','Hmmmm...',['🎁 Yes','😂 Probably not','👀 Now I’m curious']],
 ['😈','Do you still trust me?','Be careful with this one 😂',['❤️ Yes','😬 A little less','💀 Absolutely not']],
 ['😭','Should I ask you one last question?','You’re almost there...',['🔥 YES','👀 Go ahead','💀 I regret this']],
 ['🎧','Okay... ready?','Click ANY option. 👀',['😎 I’m ready','😂 Let’s go','💀 I have a bad feeling']],
 ['🎁','Final question...','Are you ready for the actual surprise? 😭',['🔥 YES, SHOW ME!','👀 DO IT!','😂 I’M READY']]
];
let current=0,name='';
const q=document.getElementById('question'),sub=document.getElementById('sub'),opts=document.getElementById('options'),emoji=document.getElementById('emoji'),count=document.getElementById('count'),audio=document.getElementById('comedy');
function startQA(){name=document.getElementById('nameInput').value.trim()||'Mystery Person';document.getElementById('nameCard').classList.add('hidden');document.getElementById('card').classList.remove('hidden');render();}
function render(){let x=questions[current];emoji.textContent=x[0];count.textContent=`QUESTION ${current+1} / 10`;q.textContent=current===0?`Ready, ${name}? ${x[1]}`:x[1];sub.textContent=x[2];opts.innerHTML='';x[3].forEach(text=>{let b=document.createElement('button');b.className='option';b.textContent=text;b.onclick=answer;opts.appendChild(b)})}
function answer(){if(current===2){audio.currentTime=0;audio.play().catch(()=>{});document.getElementById('card').classList.add('hidden');document.getElementById('stayCard').classList.remove('hidden');return;}if(current===9){document.getElementById('card').classList.add('hidden');document.getElementById('final').classList.remove('hidden');document.getElementById('finalTitle').textContent=`${name}, YOU GOT PRANKED! 💀`;return;}current++;render();}
function continueQA(){document.getElementById('stayCard').classList.add('hidden');document.getElementById('card').classList.remove('hidden');current++;render();}
</script>
</body>
</html>
